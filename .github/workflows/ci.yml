name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test-and-build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装前端依赖
        working-directory: frontend
        run: npm ci

      - name: 安装 wails3 与 task 工具
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.3
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 生成 bindings
        shell: bash
        run: |
          wails3 generate bindings -ts
          ls frontend/bindings/changeme/internal/services/ | head -5

      - name: 前端类型检查
        working-directory: frontend
        run: npx vue-tsc --noEmit

      - name: Go 静态检查与测试
        shell: bash
        run: |
          mkdir -p frontend/dist
          go vet ./...
          go test ./...

      - name: 构建
        shell: bash
        run: task build