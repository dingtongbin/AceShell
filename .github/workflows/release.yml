name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号(如 0.2.0),留空则使用 v* 标签'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-amd64
            asset: AceShell-windows-amd64.exe
            src: bin/AceShell.exe
            msix: true
          - os: ubuntu-latest
            name: linux-amd64
            asset: AceShell-linux-amd64
            src: bin/AceShell
          - os: macos-13
            name: macos-amd64
            asset: AceShell-macos-amd64
            src: bin/AceShell
          - os: macos-14
            name: macos-arm64
            asset: AceShell-macos-arm64
            src: bin/AceShell
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev

      - name: Install wails3 CLI
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        run: wails3 build

      - name: Package MSIX (store submission, unsigned)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version) { $version = $env:GITHUB_REF_NAME -replace '^v', '' }
          if (-not $version) { $version = '0.1.0' }
          Write-Host "MSIX version: $version"
          powershell -NoProfile -ExecutionPolicy Bypass -File build\windows\msix\build-msix.ps1 -Version $version

      - name: Stage artifact
        shell: bash
        run: |
          cp "${{ matrix.src }}" "${{ matrix.asset }}"
          if [ "${{ runner.os }}" = "Windows" ] && [ -f "bin/AceShell-*.msix" ]; then
            cp bin/AceShell-*.msix "AceShell-windows-amd64.msix"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.msix && 'AceShell-windows-amd64.msix' || '' }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact files
        working-directory: artifacts
        run: find . -type f -name 'AceShell-*' -exec mv {} . \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/AceShell-*
          generate_release_notes: true
